name: DB Migrate

# ── When this runs ────────────────────────────────────────────────────────────
# 1. On push to main/develop when DB-related files change (proto, migrations, seeders)
# 2. On every deployment workflow_call (called by deploy workflows)
# 3. Manually via workflow_dispatch with target selection
#
# It runs BEFORE any service is deployed — acting as the production init-container.
# If migration fails the workflow fails and deployment is blocked.

on:
  push:
    branches: [test, develop]
    paths:
      - 'proto/**/*.proto'
      - 'backend/inscore/db/migrations/**'
      - 'backend/inscore/db/seeders/**'
      - 'backend/inscore/cmd/dbops/**'
      - 'backend/inscore/db/ops/**'

  # Called by other workflows (e.g. deploy.yml) before they deploy services
  workflow_call:
    inputs:
      target:
        description: 'Database target: primary | backup | both'
        required: false
        default: 'both'
        type: string
      strict:
        description: 'Fail on schema drift'
        required: false
        default: false
        type: boolean
    secrets:
      DB_PRIMARY_HOST:
        required: true
      DB_PRIMARY_PORT:
        required: true
      DB_PRIMARY_USER:
        required: true
      DB_PRIMARY_PASSWORD:
        required: true
      DB_PRIMARY_NAME:
        required: true
      DB_BACKUP_HOST:
        required: true
      DB_BACKUP_PORT:
        required: true
      DB_BACKUP_USER:
        required: true
      DB_BACKUP_PASSWORD:
        required: true
      DB_BACKUP_NAME:
        required: true

  # Manual trigger — useful for one-off migrations or emergency rollouts
  workflow_dispatch:
    inputs:
      target:
        description: 'Database target'
        required: true
        default: 'both'
        type: choice
        options: [both, primary, backup]
      strict:
        description: 'Strict mode (fail on schema drift)'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Environment to migrate'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

# ── Prevent concurrent migrations on the same branch ─────────────────────────
concurrency:
  group: db-migrate-${{ github.ref }}
  cancel-in-progress: false   # Never cancel a running migration mid-flight

jobs:
  # ── Lint: fast, no DB needed ──────────────────────────────────────────────
  lint:
    name: Lint migration files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Lint migration SQL files
        run: go run ./backend/inscore/cmd/dbops/main.go lint

  # ── Validate: schema drift check against a temp local DB ─────────────────
  validate:
    name: Schema drift check (local PG)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: insuretech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Point primary at the local test DB for drift detection
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: testuser
      PGPASSWORD: testpass
      PGDATABASE: insuretech_test
      PGSSLMODE: disable
      # Backup points at same local DB (we only need schema drift check here)
      PGHOST2: localhost
      PGDATABASE2: insuretech_test
      PGUSER2: testuser
      PGPASSWORD2: testpass
      # Disable features that need external services
      SSLWIRELESS_MASKING_ENABLED: "false"
      SSLWIRELESS_NONMASKING_ENABLED: "false"
      KYC_SERVICE_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run migrations on test DB (strict mode)
        run: |
          go run ./backend/inscore/cmd/dbops/main.go migrate \
            --target=primary \
            --strict

      - name: Validate schema consistency
        run: |
          go run ./backend/inscore/cmd/dbops/main.go validate
          echo "✅ No schema drift detected"

  # ── Production migrate: runs against real DBs using GitHub secrets ────────
  migrate-production:
    name: Migrate production databases
    runs-on: ubuntu-latest
    needs: validate
    environment: production   # requires manual approval if configured in repo settings

    env:
      # Primary DB (DigitalOcean) — injected from GitHub secrets
      PGHOST: ${{ secrets.DB_PRIMARY_HOST }}
      PGPORT: ${{ secrets.DB_PRIMARY_PORT }}
      PGUSER: ${{ secrets.DB_PRIMARY_USER }}
      PGPASSWORD: ${{ secrets.DB_PRIMARY_PASSWORD }}
      PGDATABASE: ${{ secrets.DB_PRIMARY_NAME }}
      PGSSLMODE: require
      PGCHANNELBINDING: require
      # Backup DB (Neon) — injected from GitHub secrets
      PGHOST2: ${{ secrets.DB_BACKUP_HOST }}
      PGDATABASE2: ${{ secrets.DB_BACKUP_NAME }}
      PGUSER2: ${{ secrets.DB_BACKUP_USER }}
      PGPASSWORD2: ${{ secrets.DB_BACKUP_PASSWORD }}
      PGSSLMODE2: require
      # Disable SMS/KYC/etc for migration job
      SSLWIRELESS_MASKING_ENABLED: "false"
      SSLWIRELESS_NONMASKING_ENABLED: "false"
      KYC_SERVICE_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Determine target and flags
        id: opts
        run: |
          TARGET="${{ inputs.target || 'both' }}"
          STRICT="${{ inputs.strict || 'false' }}"
          FLAGS="--target=${TARGET}"
          if [ "$STRICT" = "true" ]; then FLAGS="$FLAGS --strict"; fi
          echo "flags=$FLAGS" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: Migrate primary database
        run: |
          echo "▶ Migrating primary DB (DigitalOcean)..."
          go run ./backend/inscore/cmd/dbops/main.go migrate --target=primary ${{ steps.opts.outputs.flags != '--target=primary' && '--target=primary' || '' }}

      - name: Migrate backup database
        # Backup migration failure is non-fatal — we warn but don't fail the job
        # so the deployment is not blocked by a backup DB issue.
        continue-on-error: true
        run: |
          echo "▶ Migrating backup DB (Neon)..."
          go run ./backend/inscore/cmd/dbops/main.go migrate --target=backup

      - name: Validate schema consistency post-migration
        run: |
          echo "▶ Validating schema consistency..."
          go run ./backend/inscore/cmd/dbops/main.go validate || \
            echo "⚠ Schema mismatch detected — run 'dbops migrate --target=backup' manually"

      - name: Summary
        if: always()
        run: |
          echo "## DB Migration Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema drift check | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Primary migration | ${{ job.status == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backup migration | ⚠ (non-fatal) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ steps.opts.outputs.target }}" >> $GITHUB_STEP_SUMMARY
