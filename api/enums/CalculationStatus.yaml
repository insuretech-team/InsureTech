CalculationStatus:
  type: string
  enum:
  - CALCULATION_STATUS_UNSPECIFIED
  - CALCULATION_STATUS_PENDING
  - CALCULATION_STATUS_CALCULATING
  - CALCULATION_STATUS_COMPLETED
  - CALCULATION_STATUS_FAILED
  - CALCULATION_STATUS_VALIDATED
  description: 'Status values for calculation. Defines lifecycle states: CALCULATION_STATUS_UNSPECIFIED,
    CALCULATION_STATUS_PENDING, CALCULATION_STATUS_CALCULATING, CALCULATION_STATUS_COMPLETED,
    CALCULATION_STATUS_FAILED (and 1 more).'
