LeadStatus:
  type: string
  enum:
  - LEAD_STATUS_UNSPECIFIED
  - LEAD_STATUS_NEW
  - LEAD_STATUS_CONTACTED
  - LEAD_STATUS_QUALIFIED
  - LEAD_SOURCE_PROPOSAL
  - LEAD_STATUS_NEGOTIATION
  - LEAD_STATUS_CONVERTED
  - LEAD_STATUS_LOST
  - LEAD_STATUS_ON_HOLD
  description: 'Status values for lead. Defines lifecycle states: LEAD_STATUS_UNSPECIFIED,
    LEAD_STATUS_NEW, LEAD_STATUS_CONTACTED, LEAD_STATUS_QUALIFIED, LEAD_SOURCE_PROPOSAL
    (and 4 more).'
