ProposalStatus:
  type: string
  enum:
  - PROPOSAL_STATUS_UNSPECIFIED
  - PROPOSAL_STATUS_DRAFT
  - PROPOSAL_STATUS_SUBMITTED
  - PROPOSAL_STATUS_IN_REVIEW
  - PROPOSAL_STATUS_APPROVED
  - PROPOSAL_STATUS_REJECTED
  - PROPOSAL_STATUS_REFUND_INITIATED
  - PROPOSAL_STATUS_REFUNDED
  - PROPOSAL_STATUS_CANCELLED
  description: 'Status values for proposal. Defines lifecycle states: PROPOSAL_STATUS_UNSPECIFIED,
    PROPOSAL_STATUS_DRAFT, PROPOSAL_STATUS_SUBMITTED, PROPOSAL_STATUS_IN_REVIEW, PROPOSAL_STATUS_APPROVED
    (and 4 more).'
