QuotingQuoteStatus:
  type: string
  enum:
  - QUOTE_STATUS_UNSPECIFIED
  - QUOTE_STATUS_DRAFT
  - QUOTE_STATUS_GENERATED
  - QUOTE_STATUS_SENT
  - QUOTE_STATUS_VIEWED
  - QUOTE_STATUS_ACCEPTED
  - QUOTE_STATUS_DECLINED
  - QUOTE_STATUS_EXPIRED
  - QUOTE_STATUS_CONVERTED
  description: 'Status values for quote. Defines lifecycle states: QUOTE_STATUS_UNSPECIFIED,
    QUOTE_STATUS_DRAFT, QUOTE_STATUS_GENERATED, QUOTE_STATUS_SENT, QUOTE_STATUS_VIEWED
    (and 4 more).'
