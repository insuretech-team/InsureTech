ContactDeletedEvent:
  type: object
  properties:
    event_id:
      type: string
    contact_id:
      type: string
    contact_name:
      type: string
    permanent:
      type: boolean
    deleted_by:
      type: string
    deleted_at:
      type: string
      format: date-time
  description: ContactDeletedEvent is emitted when a contact is deleted
