LeadDeletedEvent:
  type: object
  properties:
    event_id:
      type: string
    lead_id:
      type: string
    lead_name:
      type: string
    permanent:
      type: boolean
    deleted_by:
      type: string
    deleted_at:
      type: string
      format: date-time
  description: LeadDeletedEvent is emitted when a lead is deleted
