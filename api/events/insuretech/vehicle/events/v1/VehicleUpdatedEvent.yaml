VehicleUpdatedEvent:
  type: object
  properties:
    event_id:
      type: string
    vehicle_id:
      type: string
    model:
      type: string
    changed_fields:
      type: array
      items:
        type: string
    updated_at:
      type: string
      format: date-time
  description: VehicleUpdatedEvent is emitted when a vehicle is updated
