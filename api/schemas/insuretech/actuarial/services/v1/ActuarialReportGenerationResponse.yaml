ActuarialReportGenerationResponse:
  type: object
  properties:
    report_id:
      type: string
    report_url:
      type: string
    success:
      type: boolean
    summary:
      type: object
    warnings:
      type: array
      items:
        type: string
    generated_at:
      type: string
      format: date-time
  description: Response payload for actuarial report generation operation. Returns
    operation results and status.
