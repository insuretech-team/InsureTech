CalculationsListingRequest:
  type: object
  properties:
    calculation_type:
      $ref: '#/components/schemas/ActuarialCalculationType'
    entity_type:
      type: string
    entity_id:
      type: string
    date_from:
      type: string
      format: date-time
    date_to:
      type: string
      format: date-time
    calculated_by:
      type: string
    page_size:
      type: integer
      format: int32
    page_token:
      type: string
  description: Request payload for listing calculations listing items. Supports filtering,
    sorting, and pagination.
