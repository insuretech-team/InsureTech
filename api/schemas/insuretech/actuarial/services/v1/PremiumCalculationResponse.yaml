ActuarialPremiumCalculationResponse:
  type: object
  properties:
    calculation_id:
      type: string
    calculation_reference:
      type: string
    result:
      $ref: '#/components/schemas/PremiumCalculationResult'
    success:
      type: boolean
    errors:
      type: array
      items:
        type: string
    calculated_at:
      type: string
      format: date-time
  description: Response payload for premium calculation operation. Returns operation
    results and status.
