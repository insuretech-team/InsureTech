RatingFormulasListingRequest:
  type: object
  properties:
    insurance_type:
      type: string
    category:
      $ref: '#/components/schemas/FormulaCategory'
    status:
      $ref: '#/components/schemas/FormulaStatus'
    search_query:
      type: string
    page_size:
      type: integer
      format: int32
    page_token:
      type: string
  description: Request payload for listing rating formulas listing items. Supports
    filtering, sorting, and pagination.
