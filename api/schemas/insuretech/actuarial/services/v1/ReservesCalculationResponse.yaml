ReservesCalculationResponse:
  type: object
  properties:
    reserve_id:
      type: string
    calculation_reference:
      type: string
    result:
      $ref: '#/components/schemas/ReserveResult'
    success:
      type: boolean
    errors:
      type: array
      items:
        type: string
    calculated_at:
      type: string
      format: date-time
  description: Response payload for reserves calculation operation. Returns operation
    results and status.
