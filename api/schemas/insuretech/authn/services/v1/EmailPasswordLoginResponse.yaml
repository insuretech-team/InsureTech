EmailPasswordLoginResponse:
  type: object
  properties:
    user_id:
      type: string
    session_id:
      type: string
    session_token:
      type: string
    csrf_token:
      type: string
    user:
      $ref: '#/components/schemas/User'
    session_type:
      type: string
    password_change_required:
      type: boolean
  description: Response payload for email password login operation. Returns operation
    results and status.
