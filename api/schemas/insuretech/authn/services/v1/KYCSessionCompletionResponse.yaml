KYCSessionCompletionResponse:
  type: object
  properties:
    kyc_id:
      type: string
    status:
      type: string
    success:
      type: boolean
    liveness_confidence:
      type: number
      format: double
    profile_image_url:
      type: string
    provider_reference:
      type: string
      description: FLVE session_id
    session_state:
      type: string
      description: '"EKYC_SESSION_COMPLETED"'
    identity_match:
      type: boolean
      description: face match result
    match_score:
      type: number
      format: double
      description: cosine similarity
    summary:
      $ref: '#/components/schemas/KYCSessionSummary'
      description: step-by-step results
    completed_at:
      type: string
      description: ISO timestamp
  description: Response payload for kyc session completion operation. Returns operation
    results and status.
