LoginRequest:
  type: object
  properties:
    mobile_number:
      type: string
      description: Accepts 017..., +880..., or 00880... and is normalized to +8801XXXXXXXXX.
    password:
      type: string
      description: "Optional for B2C OTP-only login. Leave empty only after VerifyOTP\
        \ succeeds\r\n and only for JWT-style mobile/API clients. WEB login still\
        \ requires password."
    device_id:
      type: string
    device_type:
      type: string
      description: "AUTO-DETECTS: WEB\u2192Server-side, MOBILE\u2192JWT"
    device_name:
      type: string
      description: Human-readable device name
  description: Login Request
