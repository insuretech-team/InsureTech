OTPSendingRequest:
  type: object
  properties:
    recipient:
      type: string
      description: 'For sms: accepts 017..., +880..., or 00880... and is normalized
        to +8801XXXXXXXXX. For email: send a valid email address.'
    type:
      type: string
      description: registration, login, reset_password
    channel:
      type: string
      description: sms (default), email
    use_masking:
      type: boolean
      description: true = alphanumeric sender ID (BTRC masking)
  description: Send OTP Request
