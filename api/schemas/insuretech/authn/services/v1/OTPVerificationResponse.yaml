OTPVerificationResponse:
  type: object
  properties:
    verified:
      type: boolean
    user_id:
      type: string
    device_credential:
      type: string
      description: "WhatsApp-style device credential \u2014 returned ONCE after successful\
        \ OTP verify\r\n when device_type is ANDROID or IOS. Store in Android Keystore\
        \ / iOS Keychain.\r\n Use as `password` field in subsequent Login requests\
        \ (no OTP needed).\r\n Empty for WEB clients or when device_id is not provided."
  description: Response payload for otp verification operation. Returns operation
    results and status.
