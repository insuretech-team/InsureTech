RegistrationRequest:
  type: object
  properties:
    mobile_number:
      type: string
      description: Required. Accepts 017..., +880..., or 00880... and is normalized
        to +8801XXXXXXXXX.
    email:
      type: string
      description: Optional
    password:
      type: string
      description: Min 8 chars, 1 upper, 1 number, 1 special
    device_id:
      type: string
    device_type:
      type: string
  description: Register Request
