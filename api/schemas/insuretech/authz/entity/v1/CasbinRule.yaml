CasbinRule:
  type: object
  properties:
    id:
      type: string
      format: int64
      description: '@inject_tag: gorm:"primarykey;autoIncrement"'
    ptype:
      type: string
      description: "ptype: \"p\" = policy line, \"g\" = role-inheritance line\n @inject_tag:\
        \ gorm:\"size:10;uniqueIndex:unique_index\""
    v0:
      type: string
      description: "v0: subject  (p-line) | member (g-line)\n @inject_tag: gorm:\"\
        size:256;uniqueIndex:unique_index\""
    v1:
      type: string
      description: "v1: domain   (p-line: portal:tenant) | role (g-line: role:<name>)\n\
        \ NOTE: For g3 grouping rules the Casbin column order is (sub, role, domain):\n\
        \   v0 = member/user,  v1 = role,  v2 = domain\n @inject_tag: gorm:\"size:256;uniqueIndex:unique_index\""
    v2:
      type: string
      description: "v2: object   (p-line: svc:resource) | domain (g-line: portal:tenant)\n\
        \ NOTE: For g3 grouping rules the Casbin column order is (sub, role, domain):\n\
        \   v0 = member/user,  v1 = role,  v2 = domain\n @inject_tag: gorm:\"size:256;uniqueIndex:unique_index\""
    v3:
      type: string
      description: "v3: action   (p-line: HTTP verb / domain action)\n @inject_tag:\
        \ gorm:\"size:256;uniqueIndex:unique_index\""
    v4:
      type: string
      description: "v4: effect   (p-line: allow | deny)\n @inject_tag: gorm:\"size:256;uniqueIndex:unique_index\""
    v5:
      type: string
      description: "v5: reserved for future ABAC conditions / attribute matchers\n\
        \ @inject_tag: gorm:\"size:256;uniqueIndex:unique_index\""
  description: "---------------------------------------------------------------------------\n\
    \ 1. CasbinRule \u2014 raw Casbin policy/grouping rows stored in PostgreSQL.\n\
    \    Casbin gorm-adapter reads/writes this table directly.\n    p-type rows: ptype=\"\
    p\"  \u2192 policy line: sub, dom, obj, act, eft\n    g-type rows: ptype=\"g\"\
    \  \u2192 role assignment: sub, dom, role\n ---------------------------------------------------------------------------"
