EmployeeCoverageView:
  type: object
  properties:
    organisation_id:
      type: string
    organisation_name:
      type: string
    employee_uuid:
      type: string
    employee_id:
      type: string
    assigned_plan_id:
      type: string
    assigned_plan_name:
      type: string
    insurance_category:
      $ref: '#/components/schemas/InsuranceType'
