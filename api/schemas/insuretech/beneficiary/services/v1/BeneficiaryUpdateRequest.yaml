BeneficiaryBeneficiaryUpdateRequest:
  type: object
  properties:
    beneficiary_id:
      type: string
    mobile_number:
      type: string
      description: Accepts 017..., +880..., or 00880... and is normalized to +8801XXXXXXXXX.
    email:
      type: string
    address:
      type: string
  description: Request payload for updating an existing beneficiary update. Contains
    fields to be modified.
