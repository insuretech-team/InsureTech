ContactsListingRequest:
  type: object
  properties:
    status:
      $ref: '#/components/schemas/ContactStatus'
    contact_type:
      $ref: '#/components/schemas/ContactType'
    assigned_agent_id:
      type: string
    search_query:
      type: string
    page_size:
      type: integer
      format: int32
    page_token:
      type: string
  description: Request payload for listing contacts listing items. Supports filtering,
    sorting, and pagination.
