LeadsListingRequest:
  type: object
  properties:
    status:
      $ref: '#/components/schemas/LeadStatus'
    source:
      $ref: '#/components/schemas/LeadSource'
    assigned_agent_id:
      type: string
    search_query:
      type: string
    page_size:
      type: integer
      format: int32
    page_token:
      type: string
  description: Request payload for listing leads listing items. Supports filtering,
    sorting, and pagination.
