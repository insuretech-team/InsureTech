LifeProductsListingRequest:
  type: object
  properties:
    product_type:
      $ref: '#/components/schemas/LifeProductType'
    only_active:
      type: boolean
    filter:
      type: string
    page_size:
      type: integer
      format: int32
    page_token:
      type: string
  description: Request payload for listing life products listing items. Supports filtering,
    sorting, and pagination.
