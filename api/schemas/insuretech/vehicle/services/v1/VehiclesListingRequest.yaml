VehiclesListingRequest:
  type: object
  properties:
    vehicle_type:
      $ref: '#/components/schemas/VehicleType'
    manufacturer:
      type: string
    year:
      type: integer
      format: int32
    only_active:
      type: boolean
    filter:
      type: string
    page_size:
      type: integer
      format: int32
    page_token:
      type: string
  description: Request payload for listing vehicles listing items. Supports filtering,
    sorting, and pagination.
