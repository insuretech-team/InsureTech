BusinessWorkflowCreationRequest:
  type: object
  properties:
    workflow_name:
      type: string
    description:
      type: string
    workflow_type:
      $ref: '#/components/schemas/BusinessWorkflowType'
    rules:
      type: array
      items:
        $ref: '#/components/schemas/BusinessRule'
    input_schema:
      type: object
    output_schema:
      type: object
    metadata:
      type: object
    created_by:
      type: string
  description: Request payload for creating a new business workflow creation. Contains
    all required fields and optional parameters for initialization.
