database:
  # Primary database configuration (Local Docker)
  primary:
    provider: "postgres"
    host: "localhost"
    port: 5432
    database: "insuretech_primary"
    username: "postgres"
    password: "12345678"
    ssl_mode: "disable"
    max_open_conns: 15
    max_idle_conns: 5
    conn_max_lifetime: "30m"

  # Backup database configuration (Local - same as primary)
  backup:
    provider: "postgres"
    host: "localhost"
    port: 5432
    database: "insuretech_primary"
    username: "postgres"
    password: "12345678"
    ssl_mode: "disable"
    max_open_conns: 15
    max_idle_conns: 5
    conn_max_lifetime: "30m"

  signal_db:
    enabled: false

  # Failover configuration (disabled for local)
  failover:
    enabled: false

  # Synchronization configuration (disabled for local)
  sync:
    enabled: false

  backup_settings:
    enabled: false
    backup_interval: "6h"
    retention_days: 30
    backup_path: "./backups"
