# =============================================================
# Insurer Portal — insurer.labaidinsuretech.com
# HTTP: ACME challenge + redirect to HTTPS.
# HTTPS: proxy to Next.js on 127.0.0.1:3002.
# =============================================================

server {
    listen 80;
    listen [::]:80;
    server_name insurer.labaidinsuretech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name insurer.labaidinsuretech.com;

    ssl_certificate     /etc/letsencrypt/live/insurer.labaidinsuretech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/insurer.labaidinsuretech.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    access_log /var/log/nginx/insurer-portal-access.log;
    error_log  /var/log/nginx/insurer-portal-error.log warn;

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/proxy-params.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html { root /etc/nginx/error-pages; internal; }
}
