version: '3.8'

services:
  insurance-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insurance-engine
    ports:
      - "5000:5000"    # HTTP API
      - "50051:50051"  # gRPC API
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PII_ENCRYPTION_KEY=${PII_ENCRYPTION_KEY}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=insuretech_primary;Username=app;Password=${DB_PASSWORD};SearchPath=insurance_schema
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD}
      - Kafka__BootstrapServers=kafka:9092
    volumes:
      - ./logs:/app/logs
    networks:
      - insuretech
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  insuretech:
    external: true
