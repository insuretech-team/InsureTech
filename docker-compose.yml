services:
  redis:
    image: redis:7-alpine
    container_name: insuretech-redis
    # Bind to localhost only — Redis must NEVER be publicly accessible.
    # Containers on the same Docker network reach it via service name 'redis:6379'.
    # DO NOT change to 0.0.0.0 — see DigitalOcean security report.
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--bind", "0.0.0.0", "--protected-mode", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    container_name: insuretech-kafka
    # Bind Kafka external listener to localhost only — never expose to internet.
    # Internal services use INTERNAL://kafka:9092 within the Docker network.
    ports:
      - "127.0.0.1:9092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      # EXTERNAL listener advertises host-accessible address for local dev tools.
      # All microservices MUST use INTERNAL://kafka:9092 — sarama will use the
      # advertised address from broker metadata, so EXTERNAL must NOT be localhost/[::1].
      # 127.0.0.1 here is safe: sarama always prefers kafka:9092 (INTERNAL) first.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  # ── db-migrate ────────────────────────────────────────────────────────────
  # Runs ONCE at startup. Migrates primary then backup DB (proto→SQL→seeders).
  # Exits 0 on success, 1 on failure. Gateway and microservices depend on this.
  # To run manually: docker compose run --rm db-migrate
  db-migrate:
    build:
      context: .
      dockerfile: backend/infra/docker/dbops/Dockerfile
    image: insuretech-dbops
    container_name: insuretech-db-migrate
    profiles: ["full"]
    env_file:
      - .env
    command: ["./dbops", "migrate", "--target=both"]
    restart: "no"

  # ── db-sidecar ────────────────────────────────────────────────────────────
  # Long-running companion: continuous primary→backup sync + auto-backup loop.
  # Does NOT run migrations. Starts after db-migrate completes successfully.
  # To run: docker compose --profile full up db-sidecar
  db-sidecar:
    build:
      context: .
      dockerfile: backend/infra/docker/dbops/Dockerfile
    image: insuretech-dbops
    container_name: insuretech-db-sidecar
    profiles: ["sidecar", "full"]
    env_file:
      - .env
    command: ["./dbops", "sidecar"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

#  tenant:
#    build:
#      context: .
#      dockerfile: backend/infra/docker/tenant/Dockerfile
#    container_name: insuretech-tenant
#    profiles: ["tenant", "full"]
#    env_file:
#      - .env
#    ports:
#      - "50050:50050"
#      - "50051:50051"
#    restart: unless-stopped

  authn:
    image: insuretech-authn
    build:
      context: .
      dockerfile: backend/infra/docker/authn/Dockerfile
    container_name: insuretech-authn
    profiles: ["authn", "full"]
    env_file:
      - .env
    environment:
      # Override localhost addresses from .env to Docker service names
      KYC_SERVICE_ADDRESS: "kyc:50090"
      # Force Kafka to use internal Docker network name only — prevents sarama
      # from adding host.docker.internal which resolves to [::1] inside containers
      KAFKA_BROKERS: "kafka:9092"
      # Fix legacy typo: .env has B2B_ADMIN_PASSWARD (missing 'O')
      B2B_ADMIN_PASSWORD: "${B2B_ADMIN_PASSWARD}"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # gRPC ports — localhost only, gateway reaches authn via Docker network (authn:50060)
    ports:
      - "127.0.0.1:50060:50060"
      - "127.0.0.1:50061:50061"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 --timeout=3 http://localhost:50061/healthz >/dev/null 2>&1 || cat /proc/net/tcp 2>/dev/null | awk '{print $2}' | grep -qi ':C38C'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  authz:
    image: insuretech-authz
    build:
      context: .
      dockerfile: backend/infra/docker/authz/Dockerfile
    container_name: insuretech-authz
    profiles: ["authz", "full"]
    env_file:
      - .env
    environment:
      KAFKA_BROKERS: "kafka:9092"
      # Clear empty stubs from .env so authz falls through to the file-path resolver
      JWT_PUBLIC_KEY_PEM: ""
      AUTHZ_JWT_PUBLIC_KEY_PEM: ""
      # Authz reads the RSA public key from this mounted file to validate JWTs issued by authn
      JWT_PUBLIC_KEY_PATH: "/app/secrets/jwt_rsa_public.pem"
    volumes:
      - ./backend/inscore/secrets:/app/secrets:ro
    # gRPC ports — localhost only, gateway reaches authz via Docker network (authz:50070)
    ports:
      - "127.0.0.1:50070:50070"
      - "127.0.0.1:50071:50071"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 --timeout=3 http://localhost:50071/healthz >/dev/null 2>&1 || cat /proc/net/tcp 2>/dev/null | awk '{print $2}' | grep -qi ':C396'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  gateway:
    image: insuretech-gateway
    build:
      context: .
      dockerfile: backend/infra/docker/gateway/Dockerfile
    container_name: insuretech-gateway
    profiles: ["gateway", "full"]
    env_file:
      - .env
    depends_on:
      authn:
        condition: service_healthy
      authz:
        condition: service_healthy
    # HTTP port — localhost only on production. nginx proxies public traffic via 127.0.0.1:8080.
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

