  # ── docrender ─────────────────────────────────────────────────────────────
  # Python sidecar that generates DOCX (python-docx) and high-quality PDF
  # (WeasyPrint) documents. Called internally by the Go docgen service.
  # Port 8500 is internal only — not exposed outside the Docker network.
  docrender:
    build:
      context: ./backend/inscore/microservices/docgen/sidecar
      dockerfile: Dockerfile
    image: insuretech-docrender
    container_name: insuretech-docrender
    profiles: ["docgen", "full"]
    environment:
      # Uvicorn workers — scale based on CPU cores
      WEB_CONCURRENCY: "2"
    ports:
      - "127.0.0.1:8500:8500"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 --timeout=3 http://localhost:8500/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

