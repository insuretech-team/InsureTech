    restart: unless-stopped

  # ── polisync ───────────────────────────────────────────────────────────────
  # C# .NET 8 service: Products, Quotes, Orders, Policy, Commission, Claims, Underwriting
  polisync:
    image: insuretech-polisync
    build:
      context: .
      dockerfile: backend/polisync/Dockerfile
    container_name: insuretech-polisync
    profiles: ["polisync", "full"]
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Clear ASPNETCORE_HTTP_PORTS injected from .env — Kestrel endpoints are
      # defined per-service in appsettings.json (50120–50211). Leaving this set
      # to 8080 causes Kestrel to override all configured endpoints.
      ASPNETCORE_HTTP_PORTS: ""
      # Override all localhost addresses to Docker service names
      # Use production DB (DigitalOcean) — same as Go services use via PGHOST/PGUSER/PGPASSWORD
      # PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD, PGSSLMODE come from .env
      # pgBouncer (DO managed DB pooler) does NOT support SearchPath in connection string.
      # Schema is set via appsettings MigrationsHistoryTable schema; EF queries use schema-qualified table names.
      # No Reset On Close=true: required for pgBouncer transaction pooling mode
      ConnectionStrings__InsuranceDb: "Host=${PGHOST};Port=${PGPORT};Database=${PGDATABASE};Username=${PGUSER};Password=${PGPASSWORD};SslMode=Require;Trust Server Certificate=true;No Reset On Close=true"
      ConnectionStrings__CommissionDb: "Host=${PGHOST};Port=${PGPORT};Database=${PGDATABASE};Username=${PGUSER};Password=${PGPASSWORD};SslMode=Require;Trust Server Certificate=true;No Reset On Close=true"
      ConnectionStrings__Redis: "redis:6379"
      Kafka__BootstrapServers: "kafka:9092"
      InsuranceService__Url: "http://insurance:50115"
      GrpcClients__AuthnService: "http://authn:50060"
      GrpcClients__AuthzService: "http://authz:50070"
      GrpcClients__PartnerService: "http://partner:50100"
      # sync_order (Go orders service) listens on 50142 per services.yaml
      GrpcClients__OrdersService: "http://orders:50142"
      GrpcClients__FraudService: "http://fraud:50220"
      GrpcClients__PaymentService: "http://payment:50190"
      GrpcClients__NotificationService: "http://notification:50230"
      GrpcClients__KycService: "http://kyc:50090"
      GrpcClients__StorageService: "http://storage:50290"
      GrpcClients__DocgenService: "http://docgen:50280"
      GrpcClients__WorkflowService: "http://workflow:50180"
      GrpcClients__AuditService: "http://authn:50060"
      Jwt__PublicKeyPath: "/app/secrets/jwt_rsa_public.pem"
      Jwt__Audience: "insuretech-api"
      Pii__EncryptionKey: "${PII_AES_KEY}"
    volumes:
      - ./backend/inscore/secrets:/app/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      orders:
        condition: service_healthy
      insurance:
        condition: service_started
      workflow:
        condition: service_started
        required: false
    ports:
      - "127.0.0.1:50120:50120"
      - "127.0.0.1:50121:50121"
      - "127.0.0.1:50130:50130"
      - "127.0.0.1:50131:50131"
      - "127.0.0.1:50150:50150"
      - "127.0.0.1:50151:50151"
      - "127.0.0.1:50160:50160"
      - "127.0.0.1:50161:50161"
      - "127.0.0.1:50170:50170"
      - "127.0.0.1:50171:50171"
      - "127.0.0.1:50210:50210"
      - "127.0.0.1:50211:50211"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc \"exec 3<>/dev/tcp/127.0.0.1/50121 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200' <&3\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  redis_data:
  kafka_data:
  go_mod_cache:
  go_build_cache:
