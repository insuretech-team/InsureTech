  # ── mock-sms ──────────────────────────────────────────────────────────────
  # Local dev only: Mock SSL Wireless SMS gateway. Captures OTPs for test automation.
  # Endpoints: POST /api/v3/send-sms | GET /mock/last-otp | GET /health
  mock-sms:
    build:
      context: ./backend/infra/mock/sms_gateway
      dockerfile: Dockerfile
    image: insuretech-mock-sms
    container_name: insuretech-mock-sms
    profiles: ["mock-sms", "full"]
    ports:
      - "127.0.0.1:8600:8600"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8600/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

