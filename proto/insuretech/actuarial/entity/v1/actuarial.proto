      column_name: "deleted_at"
      sql_type: "TIMESTAMP WITH TIME ZONE"
    }
  ];
}

// PremiumCalculationInput represents input for premium calculations
message PremiumCalculationInput {
  string product_id = 1;
  string coverage_type = 2;
  double sum_insured = 3;
  int32 coverage_period_months = 4;
  map<string, double> rating_factors = 5;
  map<string, string> risk_characteristics = 6;
  repeated string loadings = 7;
  repeated string discounts = 8;
}

// PremiumCalculationResult represents the result of premium calculations
message PremiumCalculationResult {
  double base_premium = 1;
  double net_premium = 2;
  double gross_premium = 3;
  double total_loadings = 4;
  double total_discounts = 5;
  repeated FactorBreakdown factor_breakdown = 6;
  string currency = 7;
}

message FactorBreakdown {
  string factor_name = 1;
  string factor_type = 2; // RATING_FACTOR, LOADING, DISCOUNT
  double factor_value = 3;
  double amount = 4;
  string description = 5;
}

// LossRatioInput represents input for loss ratio calculations
message LossRatioInput {
  string product_id = 1;
  string line_of_business = 2;
  google.protobuf.Timestamp period_start = 3;
  google.protobuf.Timestamp period_end = 4;
  double earned_premium = 5;
  double written_premium = 6;
  double incurred_losses = 7;
  double loss_adjustment_expenses = 8;
  double operating_expenses = 9;
}

// LossRatioResult represents the result of loss ratio calculations
message LossRatioResult {
  double loss_ratio = 1;
  double expense_ratio = 2;
  double combined_ratio = 3;
  double underwriting_profit_margin = 4;
  string interpretation = 5; // PROFITABLE, BREAK_EVEN, LOSS_MAKING
}

// ReserveInput represents input for reserve calculations
message ReserveInput {
  string claim_id = 1;
  string calculation_method = 2; // CHAIN_LADDER, BORNHUETTER_FERGUSON, MACK, etc.
  string triangle_data_json = 3;
  double case_reserve = 4;
  double reported_claims = 5;
  double paid_claims = 6;
  int32 development_periods = 7;
  double confidence_level = 8;
}

// ReserveResult represents the result of reserve calculations
message ReserveResult {
  double case_reserve = 1;
  double ibnr_reserve = 2;
  double ibner_reserve = 3;
  double expense_reserve = 4;
  double total_reserve = 5;
  double lower_bound = 6;
  double upper_bound = 7;
  string method_used = 8;
}

// ActuarialVariable represents a variable definition for rating formulas
message ActuarialVariable {
  string variable_name = 1;
  string variable_type = 2; // STRING, DOUBLE, BOOLEAN, DATE
  string description = 3;
  bool is_required = 4;
  string default_value = 5;
  double min_value = 6;
  double max_value = 7;
  repeated string allowed_values = 8;
}
