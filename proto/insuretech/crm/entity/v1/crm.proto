  string first_name = 3 [
    (insuretech.common.v1.column) = {
      column_name: "first_name"
      sql_type: "VARCHAR(100)"
      not_null: true
      comment: "First name"
      index: {
        index_name: "idx_leads_first_name"
        index_type: INDEX_TYPE_BTREE
      }
    }
  ];
  // @inject_tag: gorm:"column:first_name;not null"

  string last_name = 4 [
    (insuretech.common.v1.column) = {
      column_name: "last_name"
