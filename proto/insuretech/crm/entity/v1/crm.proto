syntax = "proto3";

package insuretech.crm.entity.v1;

option go_package = "github.com/newage-saint/insuretech/gen/go/insuretech/crm/entity/v1;crmv1";
option csharp_namespace = "Insuretech.Crm.Entity.V1";

import "google/protobuf/timestamp.proto";
import "insuretech/common/v1/db.proto";

// Lead represents a prospective customer
// Maps to 'leads' table in crm_schema
message Lead {
  option (insuretech.common.v1.table) = {
    table_name: "leads"
    schema_name: "crm_schema"
    migration_order: 250
    is_table: true
    comment: "Prospective customers and sales leads"
    soft_delete: true
    audit_fields: true
    enable_rls: true
  };

  string lead_id = 1 [
    (insuretech.common.v1.column) = {
      column_name: "lead_id"
      sql_type: "UUID"
      primary_key: true
      not_null: true
      default_value: "gen_random_uuid()"
      comment: "Primary key - Lead UUID"
    }
  ];
  // @inject_tag: gorm:"primaryKey;column:lead_id;not null"

  string title = 2 [
    (insuretech.common.v1.column) = {
      column_name: "title"
