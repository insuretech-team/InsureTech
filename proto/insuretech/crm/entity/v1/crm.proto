  string gender = 6 [
    (insuretech.common.v1.column) = {
      column_name: "gender"
      sql_type: "VARCHAR(20)"
      comment: "Gender (Male, Female, Other)"
    }
  ];
  // @inject_tag: gorm:"column:gender"

  string phone_number = 7 [
    (insuretech.common.v1.column) = {
      column_name: "phone_number"
      sql_type: "VARCHAR(20)"
      not_null: true
