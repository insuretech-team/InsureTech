        index_name: "idx_leads_email"
        index_type: INDEX_TYPE_BTREE
      }
    }
  ];
  // @inject_tag: gorm:"column:email_address;not null"

  string address = 9 [
    (insuretech.common.v1.column) = {
      column_name: "address"
      sql_type: "TEXT"
      comment: "Physical address"
    }
  ];
