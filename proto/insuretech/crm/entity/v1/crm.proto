  string alternate_phone_number = 10 [
    (insuretech.common.v1.column) = {
      column_name: "alternate_phone_number"
      sql_type: "VARCHAR(20)"
      comment: "Alternate phone"
    }
  ];
  // @inject_tag: gorm:"column:alternate_phone_number"

  string additional_email_address = 11 [
    (insuretech.common.v1.column) = {
      column_name: "additional_email_address"
