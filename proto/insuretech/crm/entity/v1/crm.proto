enum LeadSource {
  LEAD_SOURCE_UNSPECIFIED = 0;
  LEAD_SOURCE_WEBSITE = 1;
  LEAD_SOURCE_REFERRAL = 2;
  LEAD_SOURCE_SOCIAL_MEDIA = 3;
  LEAD_SOURCE_EMAIL_CAMPAIGN = 4;
  LEAD_SOURCE_PHONE_INQUIRY = 5;
  LEAD_SOURCE_WALK_IN = 6;
  LEAD_SOURCE_PARTNER = 7;
  LEAD_SOURCE_ADVERTISEMENT = 8;
  LEAD_SOURCE_EVENT = 9;
  LEAD_SOURCE_OTHER = 10;
}

enum LeadStatus {
  LEAD_STATUS_UNSPECIFIED = 0;
  LEAD_STATUS_NEW = 1;
  LEAD_STATUS_CONTACTED = 2;
  LEAD_STATUS_QUALIFIED = 3;
  LEAD_SOURCE_PROPOSAL = 4;
  LEAD_STATUS_NEGOTIATION = 5;
  LEAD_STATUS_CONVERTED = 6;
  LEAD_STATUS_LOST = 7;
  LEAD_STATUS_ON_HOLD = 8;
}

enum LeadPriority {
  LEAD_PRIORITY_UNSPECIFIED = 0;
  LEAD_PRIORITY_LOW = 1;
  LEAD_PRIORITY_MEDIUM = 2;
  LEAD_PRIORITY_HIGH = 3;
  LEAD_PRIORITY_URGENT = 4;
}

enum QualificationStatus {
  QUALIFICATION_STATUS_UNSPECIFIED = 0;
  QUALIFICATION_STATUS_UNQUALIFIED = 1;
  QUALIFICATION_STATUS_IN_PROGRESS = 2;
  QUALIFICATION_STATUS_QUALIFIED = 3;
  QUALIFICATION_STATUS_DISQUALIFIED = 4;
}

