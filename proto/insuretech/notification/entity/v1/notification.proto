  // @inject_tag: gorm:"column:source_topic"

  string payload = 6 [
    (insuretech.common.v1.column) = {
      column_name: "payload"
      sql_type: "JSONB"
      not_null: true
      default_value: "'{}'::jsonb"
      is_json: true
      comment: "Serialized webhook payload"
