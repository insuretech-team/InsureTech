  // @inject_tag: gorm:"column:subscription_id;not null"

  string notification_id = 3 [
    (insuretech.common.v1.column) = {
      column_name: "notification_id"
      sql_type: "UUID"
      comment: "Related notification ID when delivery came from a queued notification"
      foreign_key: {
        references_table: "notifications"
        references_column: "notification_id"
        references_schema: "notification_schema"
        on_delete: REFERENTIAL_ACTION_CASCADE
